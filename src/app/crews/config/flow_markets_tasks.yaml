# FlowMarkets 任务定义
# technical_only 模式仅执行 task_fm_technical；full 模式按序执行下列全部 Task。

task_fm_market:
  agent: market_analyst
  context: []
  description: |
    用户诉求：{{user_query}}
    标的提示（可为空）：{{symbol}}
    补充说明：{{notes}}
    交付里程碑：完成《市场结构简报》结构化输出（MarketStructureBrief）。

    【工具 — 须先调用再写 JSON】
    1. 若 symbol 非「未指定」：调用 get_market_ticker_summary(symbol=标的)，将返回的 24h 价量/资金费率写入 facts（标注来源 Binance 公开 API）。
    2. 用 baidu_search 检索宏观/流动性/政策（2–4 次，关键词含标的名 + 美联储/流动性/加密监管等）；检索失败则 facts 标注「待检索」、assumptions 列出缺什么。

    聚焦宏观与流动性结构；禁止编造未出现在工具输出中的具体价格/成交量。
  expected_output: |
    符合 MarketStructureBrief 契约的完整 JSON：含 facts、inferences、assumptions、
    liquidity_and_market_phase、key_drivers（≥3）、disclaimer；字段质量标准见各 Field description。

task_fm_narrative:
  agent: narrative_analyst
  context:
    - task_fm_market
  description: |
    用户诉求：{{user_query}}，标的：{{symbol}}。
    结合上游《市场结构简报》，交付 NarrativeBrief：归纳公开叙事、标注来源可信度与未证实传言。

    【工具】用 baidu_search 检索标的相关叙事（媒体、公告、社区、KOL，2–4 次）。
    无 API Key 或零结果时：narratives 可仅基于上游简报推断，并必填 pending_search_keywords（3–8 个）与 pending_channels；禁止编造具体报道标题或 URL。
  expected_output: |
    符合 NarrativeBrief 契约的完整 JSON；无检索工具时填写 pending_search_keywords 与 pending_channels。

task_fm_sentiment:
  agent: sentiment_analyst
  context:
    - task_fm_market
    - task_fm_narrative
  description: |
    基于市场简报与叙事摘要，交付 SentimentAssessment：情绪与行为维度，每条信号须含失效条件。

    【工具】
    1. 若 symbol 有效：先 get_market_ticker_summary，将 24h 波动、成交量、last_funding_rate 写入 signals（注明数据来源）。
    2. baidu_search 补充恐慌贪婪/资金费率/拥挤交易等公开讨论（1–3 次）；失败则基于行情工具 + 上游简报，勿编造新闻。

    signals 至少 2 条；禁止喊单式结论。
  expected_output: |
    符合 SentimentAssessment 契约的完整 JSON；signals 至少 2 条，禁止喊单式结论。

task_fm_technical:
  agent: technical_analyst
  context: []
  description: |
    用户诉求：{{user_query}}，标的：{{symbol}}，补充：{{notes}}。

    分析模式：{{analysis_mode}}（single=单周期 | multi_timeframe=多级别联立 4h/1h/15m）

    --- 预注入多级别 JSON（multi_timeframe 模式由服务端写入；single 模式可忽略）---
    {{multi_timeframe_context}}

    === 单周期模式（analysis_mode=single）===
    1. 调用 get_chan_structure：symbol={{symbol}}（「未指定」也调用并在 brief 说明），timeframe={{primary_timeframe}}，lookback={{lookback}}。
       未拿到工具返回前不要写最终 JSON。
    2. 只分析工具返回的 data（ok=false 则只填 brief 待数据项，chanlun_v2=null）。禁止编造笔/中枢/价位；
       禁止用均线、MACD、消息、情绪做依据。

    === 多级别联立（analysis_mode=multi_timeframe）===
    1. 以上「预注入多级别 JSON」已含 4h/1h/15m 结构与 combined_judgment；须三级别联立分析，禁止只看单一级别。
    2. 仍须调用 get_chan_structure：symbol={{symbol}}，timeframe=1h，lookback={{lookback}}——
       仅用于 history（胜率/相似案例/learning_feedback/state_machine_hints）；结构事实以预注入 JSON 为准。
    3. chanlun_v2.meta.interval 固定 1h（中级别）；analysis_markdown 须含多级别段落：
       大级别定方向 → 中级别买卖点 → 小级别入场；写明 combined_judgment.resonance 与级别是否一致。
    4. 概率与状态机须反映级别分歧：resonance=mixed 时宜保守（WAIT_CONFIRMATION / OBSERVE_ONLY）。

    === 通用（两种模式）===
    3. 一次输出 TechnicalAnalysisDeliverable（仅 brief、chanlun_v2 两个顶层键）：

    【结构优先——分配走势概率与状态机前强制执行】
    - 中枢 relation=extend → 震荡概率通常最高（宜≥40%），勿因一笔向下/向上就判单边最高
    - 中枢 relation=new → 多/空/震荡更均衡，避免任一方向概率>50%
    - price_position：inside_zs 偏震荡；above_zs 偏多；below_zs 偏空（均警惕反向）
    - signal 买卖点：仅 ±5%～10% 微调；背驰在 extend 下可能是震荡内小反转，勿轻易单边最高

    【brief】ok=true 时：
    - structure_quickview：一行事实（价、ZG/ZD、最新笔、signal、笔段数）
    - summary：2～3 句执行摘要，不重复长文
    - analysis_markdown：必填六节 Markdown 字符串——
      「一、技术形态概述」「二、当前市场状态」「三、关键技术信号」
      「四、可能走势分析（概率排序）」至少2种至多3种走势、概率合计约100%、
      「五、操作建议」多/空/震荡入场止损目标、「六、风险提示」
    - disclaimer：含历史形态不保证未来表现、不构成投资建议

    【chanlun_v2】ok=true 时必填（version=2.0, output_mode=state_machine）：
    - meta/structure_judgement/risk_notes 与 data 一致
    - state_machine.current_state：STRATEGY_ACTIVE | WAIT_CONFIRMATION | OBSERVE_ONLY
    - active_strategy：direction **仅 up 或 down**（禁止 range；震荡放 standby_strategies.direction=range）；
      entry_gate.price_zone 两数；structure_required 非空；
      execution 含 stop_loss、target、rr
    - invalidation：invalidate_active_if≥1 条；next_state
    - standby_strategies 可选；与 analysis_markdown 主推方向不得矛盾

    【history 硬约束】工具返回 history.state_machine_hints.recommended_floor 非空时：
    - recommended_floor=OBSERVE_ONLY → current_state 必须 OBSERVE_ONLY
    - recommended_floor=WAIT_CONFIRMATION → 不得 STRATEGY_ACTIVE
    - 服务端会在输出后强制降级并在 risk_notes 说明；Prompt 须先遵守，避免与最终交付冲突

  expected_output: |
    单一 JSON：TechnicalAnalysisDeliverable（brief + chanlun_v2 或 null）。
    禁止输出 Markdown 包裹、禁止前言、禁止编造 K 线/笔/中枢/点位。
    JSON 语法必须合法：每个对象只写一层 `{`，禁止 `{ {` 或重复开括号；不要用 trailing comma。

task_fm_synthesis:
  agent: research_manager
  context: []
  description: |
    用户诉求：{{user_query}}，标的：{{symbol}}，补充：{{notes}}。

    整合四域产出，交付 ResearchSynthesis。下列 JSON 由服务端注入（技术域为治理后终稿，勿改用未标注的 Crew 中间输出）。

    --- 市场结构简报（MarketStructureBrief）---
    {{upstream_market_context}}

    --- 舆情与叙事（NarrativeBrief）---
    {{upstream_narrative_context}}

    --- 情绪与行为（SentimentAssessment）---
    {{upstream_sentiment_context}}

    --- 技术分析终稿（TechnicalAnalysisDeliverable，已 history enforcement + signal_quality）---
    {{governed_technical_context}}

    --- 分析记忆库统计（与 technical history 同源，勿编造胜率）---
    {{analysis_stats_context}}

    【综合规则】
    - 缠论状态机、signal_quality、risk_notes 以 governed_technical_context 为准；不得写比其更激进的 STRATEGY_ACTIVE。
    - 宏观/叙事/情绪与技术冲突时，disagreements 须列出各方证据强弱。
    - stats 样本不足时，information_gaps 注明需更多 --save 与 outcome 回填。
    - 不重复计算笔/中枢/买卖点；不输出具体下单价位。
  expected_output: |
    符合 ResearchSynthesis 契约的完整 JSON；含 disagreements、scenarios、information_gaps、next_research_steps。

task_fm_trading:
  agent: trader
  context:
    - task_fm_synthesis
  description: |
    用户诉求：{{user_query}}，标的：{{symbol}}。
    结合上游 task_fm_synthesis 的 ResearchSynthesis，并**优先**服从下列服务端注入（治理后状态机与统计）。

    --- 研究经理综合（Crew context 亦有 JSON，以本段与下列约束为准）---

    --- 缠论状态机快览（必读）---
    {{state_machine_summary}}

    --- 信号质量（必读）---
    {{signal_quality_summary}}

    --- 分析记忆库统计（引用胜率须注明样本量；勿编造）---
    {{execution_stats_context}}

    【TradingPlaybook 规则】
    - current_state=OBSERVE_ONLY → stance 宜「观望」或「情景驱动」；watch_triggers 为主，禁止具体价位入场
    - WAIT_CONFIRMATION → 禁止偏多/偏空思路；只写确认条件
    - signal_quality.action 为 skip/wait → 同上，execution_discipline 须含「模拟/回测优先」
    - STRATEGY_ACTIVE 且与 synthesis 一致 → 方可写 entry_logic_types（抽象逻辑类型，非下单指令）
    - 不接入回测引擎：不得声称「历史回测证明盈利」；可写「建议先模拟/纸面验证」
    - high_risk_warnings 须覆盖杠杆/合约尾部风险（若相关）
  expected_output: |
    符合 TradingPlaybook 契约的完整 JSON；强调模拟与回测优先。

task_fm_portfolio:
  agent: portfolio_manager
  context:
    - task_fm_synthesis
    - task_fm_trading
  description: |
    用户诉求：{{user_query}}，标的：{{symbol}}。
    结合 ResearchSynthesis、TradingPlaybook，并服从治理后状态机与统计（与 trader 同源）。

    --- 缠论状态机快览 ---
    {{state_machine_summary}}

    --- 信号质量 ---
    {{signal_quality_summary}}

    --- 分析记忆库统计 ---
    {{execution_stats_context}}

    【PortfolioBrief 规则】
    - 风险预算与 trading 的 stance 一致；OBSERVE_ONLY / 低质量信号时偏防御、降低战术层暴露
    - stress_narratives 覆盖状态机 invalidation 与 synthesis 备选情景
    - 不重复论证笔/中枢；不做回测净值预测
    - disclaimer 完整（非投资建议、适用人群、波动风险）
  expected_output: |
    符合 PortfolioBrief 契约的完整 JSON；作为研究链终稿章节之一。
